<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد أبو يوسف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1a1a24;
    --border: #2a2a3a;
    --gold: #c9a84c;
    --gold-light: #e8c96d;
    --gold-dim: #6b5520;
    --text: #f0eee8;
    --text-dim: #8a8a9a;
    --green: #2ecc71;
    --red: #e74c3c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--gold-dim);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .header-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .header-info h1 {
    font-size: 17px;
    font-weight: 900;
    color: var(--gold-light);
    line-height: 1.2;
  }

  .header-info p {
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-right: auto;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .quick-actions {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .quick-actions::-webkit-scrollbar { display: none; }

  .quick-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    color: var(--text-dim);
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .quick-btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold-light);
    background: rgba(201,168,76,0.08);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .msg.assistant .msg-avatar { background: linear-gradient(135deg, var(--gold-dim), #3a2a0a); }
  .msg.user .msg-avatar { background: var(--card); border: 1px solid var(--border); }

  .msg-bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
  }

  .msg.assistant .msg-bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }

  .msg.user .msg-bubble {
    background: linear-gradient(135deg, var(--gold-dim), #4a3010);
    border: 1px solid var(--gold-dim);
    border-bottom-left-radius: 4px;
    color: var(--gold-light);
    text-align: right;
  }

  .msg-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    text-align: center;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-right-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--gold-dim);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); background: var(--gold); }
  }

  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within { border-color: var(--gold-dim); }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 100px;
    line-height: 1.5;
  }

  textarea::placeholder { color: var(--text-dim); }

  .mic-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    padding: 2px;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  .mic-btn:hover { color: var(--gold); }
  .mic-btn.recording { color: var(--red); animation: pulse 1s infinite; }

  .send-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    border: none;
    border-radius: 12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: transform 0.15s, opacity 0.15s;
    flex-shrink: 0;
  }

  .send-btn:hover { transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">✂️</div>
  <div class="header-info">
    <h1>مساعد أبو يوسف</h1>
    <p>صالون الحلاقة · الذكاء الاصطناعي</p>
  </div>
  <div class="status-dot"></div>
</div>

<div class="quick-actions">
  <button class="quick-btn" onclick="sendQuick('جيبلي تقرير النهارده')">📊 تقرير اليوم</button>
  <button class="quick-btn" onclick="sendQuick('كام عميل النهارده؟')">👥 عدد العملاء</button>
  <button class="quick-btn" onclick="sendQuick('إيه أكتر خدمة مطلوبة؟')">✂️ أكتر خدمة</button>
  <button class="quick-btn" onclick="sendQuick('الإيرادات الكلية النهارده؟')">💰 الإيرادات</button>
  <button class="quick-btn" onclick="sendQuick('نصايح لتحسين الصالون')">💡 نصايح</button>
</div>

<div class="messages" id="messages">
  <div class="msg assistant">
    <div class="msg-avatar">✂️</div>
    <div>
      <div class="msg-bubble">
        أهلاً يا أبو يوسف! 👋<br><br>
        أنا مساعدك الشخصي لصالون الحلاقة. أقدر أساعدك في:<br><br>
        📊 <strong>تقارير وإحصائيات</strong> الصالون<br>
        💡 <strong>نصايح</strong> لتحسين الأعمال<br>
        📝 <strong>إدارة العملاء</strong> والخدمات<br><br>
        اكتب أمرك أو اتكلم! 🎙️
      </div>
      <div class="msg-time">دلوقتي</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎙️</button>
    <textarea id="msgInput" placeholder="اكتب أمرك هنا..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZdWHffCa91ZqLti1HbYx6B9hhbypJSkVIRGHKXHXfoiPQUvoHsnYOI8IuyZ3DCeT7GQ/exec';

let isRecording = false;
let recognition = null;
let isLoading = false;
let conversationHistory = [];

const SYSTEM_PROMPT = `أنت مساعد شخصي ذكي لأبو يوسف، صاحب صالون حلاقة في مصر.

تخصصك:
- مساعدة صاحب الصالون في إدارة أعماله
- تقديم نصايح لتحسين الصالون
- الإجابة على أسئلة عن إدارة العملاء والخدمات والإيرادات

بيانات الصالون: التاريخ، الوقت، رقم التليفون، اسم العميل، اسم الحلاق، الخدمة، طريقة الدفع، السعر المقترح، المبلغ.

قواعد:
- رد دايماً بالعربي المصري
- كن موجز ومفيد وودود
- استخدم إيموجي بشكل معقول`;

function addMessage(role, content, isHTML = false) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const now = new Date();
  const time = now.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
  const avatar = role === 'assistant' ? '✂️' : '👤';
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-bubble">${isHTML ? content : escapeHtml(content).replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${time}</div>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">✂️</div>
    <div class="typing"><span></span><span></span><span></span></div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendQuick(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  conversationHistory.push({ role: 'user', parts: [{ text }] });

  showTyping();

  try {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ message: text }),
      redirect: 'follow'
    });

    const data = await response.json();
    hideTyping();

    const reply = data.reply || 'معلش، في مشكلة. حاول تاني.';
    conversationHistory.push({ role: 'assistant', content: reply });

    const formatted = reply
      .replace(/```[\w]*\n([\s\S]*?)```/g, '<pre style="background:#0a0a0f;border:1px solid #2a2a3a;border-radius:8px;padding:10px;font-size:11px;direction:ltr;overflow-x:auto;margin-top:8px;color:#e8c96d">$1</pre>')
      .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#e8c96d">$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');

    addMessage('assistant', formatted, true);

  } catch (err) {
    hideTyping();
    addMessage('assistant', '❌ في مشكلة في الاتصال. تأكد من الإنترنت وحاول تاني.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMessage('assistant', '❌ المتصفح بتاعك مش بيدعم التعرف على الصوت. جرب Chrome.');
    return;
  }

  if (isRecording) {
    recognition?.stop();
    isRecording = false;
    document.getElementById('micBtn').className = 'mic-btn';
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'ar-EG';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('micBtn').className = 'mic-btn recording';
  };

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('msgInput').value = transcript;
    autoResize(document.getElementById('msgInput'));
  };

  recognition.onend = () => {
    isRecording = false;
    document.getElementById('micBtn').className = 'mic-btn';
    setTimeout(() => {
      if (document.getElementById('msgInput').value.trim()) sendMessage();
    }, 500);
  };

  recognition.onerror = () => {
    isRecording = false;
    document.getElementById('micBtn').className = 'mic-btn';
  };

  recognition.start();
}
</script>
</body>
</html>
